
version: '3.8'

services:
  redis-llm:
    image: redis:7-alpine
    container_name: redis-aura
    ports: ["6379:6379"]
    command: redis-server --bind 0.0.0.0 --maxmemory 1250kb --maxmemory-policy noeviction --appendonly no
    volumes:
      - ./data/redis-aura:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 5
  
  redis-lru:
    image: redis:7-alpine
    container_name: redis-lru
    ports: ["6380:6380"]
    command: redis-server --port 6380 --bind 0.0.0.0 --maxmemory 1250kb --maxmemory-policy noeviction --appendonly no
    volumes:
      - ./data/redis-lru:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 1s
      timeout: 3s
      retries: 5
  
  mongo:
    image: mongo:6
    container_name: mongo_db
    ports: ["27017:27017"]
    volumes:
      - ./data/mongodb:/data/db

  # executor:
  #   build:
  #     context: ./executor
  #     dockerfile: Dockerfile.rust
  #   container_name: policy-executor
  #   ports:
  #     - "9097:9097"
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #     kafka-init:
  #       condition: service_completed_successfully
  #     redis-llm:
  #       condition: service_healthy
  #     streamer:
  #       condition: service_started
  # NOTE: Executor Rust is disabled - all functionality moved to Python streamer.py policy_listener

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "echo stat | nc localhost 2181"]
      interval: 5s
      timeout: 2s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_broker
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy  
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092"]
      interval: 10s
      timeout: 15s
      retries: 5
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka-init/init-topics.sh:/init-topics.sh
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVER: "kafka:29092"
      TOPICS_TO_CREATE: "aura-plan:1:1,aura-stats:1:1"

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus:/etc/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  streamer:
    build: .
    container_name: streamer
    ports:
      - "8000:8000"
    working_dir: /app
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis-llm:
        condition: service_healthy
      redis-lru:
        condition: service_healthy
      aura-brain:
        condition: service_started
      ollama:
        condition: service_healthy
    entrypoint: sh
    command: -c "python -m src.services.streamer || /bin/sh"
    stdin_open: true
    tty: true
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    env_file:
      - .env
    environment:
      # - USE_GROQ=false  # Commentato per test locali - per groq cloud llm test decommentare
      - AURA_TTL_TIME_COMPRESSION=60
      - OLLAMA_HOST=${OLLAMA_HOST:-ollama}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma2:2b}
      - FLUSH_ON_STARTUP=true
      - TINYLFU_DEBUG=${TINYLFU_DEBUG:-false}

  aura-brain:
    build: .
    container_name: aura-brain
    working_dir: /app
    depends_on:
      kafka:
        condition: service_healthy
      ollama:
        condition: service_healthy
    entrypoint: sh
    command: -c "python -m src.services.brain || /bin/sh"
    stdin_open: true
    tty: true
    volumes:
      - ./data:/app/data
      - ./src:/app/src
    env_file:
      - .env
    environment:
      # - USE_GROQ=false  # Commentato per test locali - per groq cloud llm test decommentare
      - OLLAMA_HOST=${OLLAMA_HOST:-ollama}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma2:2b}
      - FLUSH_ON_STARTUP=true
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python -m src.services.brain' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
      - ./scripts/ollama-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    # GPU configuration added via docker-compose.gpu.yml if GPU available
    healthcheck:
      test: ["CMD", "pgrep", "-f", "ollama serve"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - OLLAMA_HOST=0.0.0.0
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=salvatore
      - GF_SECURITY_ADMIN_PASSWORD=labthesis
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

  test-runner:
    build: .
    container_name: test-runner
    working_dir: /app
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis-llm:
        condition: service_healthy
      redis-lru:
        condition: service_healthy
      streamer:
        condition: service_started
      aura-brain:
        condition: service_started
      prometheus:
        condition: service_started
      ollama:
        condition: service_healthy
    entrypoint: sh
    command: -c "sleep 30 && python scripts/test_runner.py || /bin/sh"
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./scripts:/app/scripts
    env_file:
      - .env
    environment:
      - MAX_EVENTS=${MAX_EVENTS:-100000}
      - OLLAMA_HOST=${OLLAMA_HOST:-ollama}
    restart: "no"

volumes:
  ollama:
  grafana-storage: